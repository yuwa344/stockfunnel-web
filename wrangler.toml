name = "stockfunnel"
main = "worker/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# D1 binding - run: wrangler d1 create stockfunnel
# then replace database_id below with the returned value
[[d1_databases]]
binding = "DB"
database_name = "stockfunnel"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true

[vars]
APP_NAME = "六层漏斗选股"
